<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>psoc alive results</title>
<style>
:root{color-scheme:dark;--bg:#090d12;--panel:#101720;--panel2:#151e29;--line:#263345;--text:#e7eef7;--muted:#8fa0b5;--ok:#44d17a;--bad:#ff6b6b;--accent:#65a7ff;--warn:#f7c948}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0d131b,#090d12 240px);color:var(--text);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:1180px;margin:0 auto;padding:24px 18px 56px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}.brand{font-size:20px;font-weight:800;letter-spacing:-.03em}.nav{display:flex;gap:7px;align-items:center}.nav a{color:var(--muted);text-decoration:none;border:1px solid transparent;border-radius:10px;padding:8px 11px}.nav a:hover,.nav a.active{color:var(--text);background:var(--panel2);border-color:var(--line)}.nav .count{display:inline-block;min-width:20px;text-align:center;margin-left:5px;padding:1px 5px;border-radius:999px;background:#20344f;color:#b9d7ff;font-size:11px}header{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:16px}h1{margin:0;font-size:30px;letter-spacing:-.04em}header p{margin:5px 0 0;color:var(--muted)}.badge{padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:#0c1219}.panel{background:rgba(16,23,32,.92);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 48px rgba(0,0,0,.15);padding:16px;margin-bottom:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.space{justify-content:space-between}.status{font-size:12px;color:var(--muted)}.status.running{color:var(--warn)}.status.err{color:var(--bad)}input,button{font:inherit}input[type=search],input[type=number]{background:#0a1017;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 10px;outline:none}input[type=search]{min-width:250px}input[type=number]{width:82px}input:focus{border-color:var(--accent)}button{border-radius:10px;padding:9px 13px;font-weight:650;cursor:pointer;background:var(--panel2);color:var(--text);border:1px solid var(--line)}button.primary{background:var(--accent);color:#06101e;border-color:transparent}button.stop:not(:disabled){border-color:#6c3940;color:#ffb0b0}button:disabled{opacity:.45;cursor:not-allowed}.measure-control{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:10px 11px;border-bottom:1px solid #202b39}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;background:#0d141d;position:sticky;top:0}tbody tr:hover{background:#131c27}.proto,.country{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 7px;color:#bed3ed}.latency{font-weight:750;color:var(--ok)}.speed{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.empty{padding:24px;text-align:center;color:var(--muted)}.progress{height:8px;background:#0a1017;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:12px}.progress>span{display:block;height:100%;width:0;background:var(--accent);transition:width .25s ease}.summary{display:flex;gap:14px;align-items:center;flex-wrap:wrap}@media(max-width:850px){header{align-items:start;flex-direction:column}.row.space{align-items:flex-start}.tools{width:100%}.tools input[type=search]{flex:1;min-width:160px}.wrap{padding-left:14px;padding-right:14px}}@media(max-width:520px){.tools{align-items:stretch}.tools input[type=search]{width:100%;flex-basis:100%}.measure-control{flex:1}.nav a{padding:7px 9px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><div class="brand">psoc</div><nav class="nav"><a href="/">Overview</a><a class="active" href="/results">Results <span class="count" id="navAlive">0</span></a></nav></div>
  <header><div><h1>Alive proxy results</h1><p>Only verified alive proxies are shown. Lowest latency is always listed first.</p></div><div class="badge" id="version">dashboard</div></header>
  <section class="panel">
    <div class="row space">
      <div class="summary"><strong><span id="alive">0</span> alive</strong><span class="status" id="lowest">Lowest latency: 0 ms</span><span class="status" id="scanStatus">idle</span></div>
      <div class="row tools">
        <input id="filter" type="search" placeholder="Filter target, protocol, country">
        <button id="refreshBtn">Refresh</button>
        <button id="stopBtn" class="stop" disabled>Stop checking</button>
        <label class="measure-control">Download MB <input id="downloadMB" type="number" min="1" max="100" step="1" value="1"></label>
        <button id="measureBtn" class="primary">Start downspeed</button>
      </div>
    </div>
    <div class="progress"><span id="progressBar"></span></div>
    <div class="status" id="scanProgress" style="margin-top:7px"></div>
  </section>
  <section class="panel">
    <div class="table-wrap"><table><thead><tr><th>#</th><th>Protocol</th><th>Target</th><th>Country</th><th>Latency</th><th>Downspeed</th><th>HTTP</th><th>Checked</th></tr></thead><tbody id="rows"></tbody></table></div>
  </section>
</div>
<script>
const $=s=>document.querySelector(s);let all=[];let timer=null;let currentStatus={};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function flag(cc){cc=String(cc||'').toUpperCase();if(!/^[A-Z]{2}$/.test(cc))return '';return [...cc].map(c=>String.fromCodePoint(127397+c.charCodeAt(0))).join('')}
async function jget(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(await r.text());return r.json()}
function authHeaders(extra={}){const h={...extra};const token=sessionStorage.getItem('psoc-token')||'';if(token)h['Authorization']='Bearer '+token;return h}
function render(){const q=$('#filter').value.trim().toLowerCase();const rows=all.filter(x=>!q||[x.target,x.protocol,x.country].some(v=>String(v||'').toLowerCase().includes(q)));const pending=currentStatus.measuring?'measuring…':'not measured';$('#rows').innerHTML=rows.map((x,i)=>`<tr><td class="muted">${i+1}</td><td><span class="proto">${esc(x.protocol)}</span></td><td>${esc(x.target)}</td><td>${x.country?`<span class="country">${flag(x.country)} ${esc(x.country)}</span>`:`<span class="muted">${pending}</span>`}</td><td class="latency">${x.latency_ms||0} ms</td><td class="speed">${x.down_mbps?Number(x.down_mbps).toFixed(2)+' Mbps':`<span class="muted">${pending}</span>`}</td><td>${x.status||'-'}</td><td class="muted">${x.checked_at?new Date(x.checked_at).toLocaleString():'-'}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No alive proxies yet.</td></tr>'}
function updateStatus(status,alive){currentStatus=status;const scanning=!!status.scanning,measuring=!!status.measuring;let pct=0,progress='',label='idle',cls='status';if(scanning){pct=status.percent||0;progress=status.total?`${status.completed||0}/${status.total} checks · ${pct}%`:'';label='proxy checking…';cls+=' running'}else if(measuring){pct=status.measure_percent||0;progress=status.measure_total?`${status.measure_completed||0}/${status.measure_total} proxies · ${pct}% · ${status.download_mb||1} MB each · 5 concurrent`:'';label='measuring downspeed…';cls+=' running'}else if(status.last_measure_error){pct=status.measure_percent||0;label='downspeed failed';cls+=' err';progress=status.last_measure_error}else if(status.last_error){pct=status.percent||0;label='last proxy check failed';cls+=' err';progress=status.last_error}else if(status.measure_total){pct=status.measure_percent||0;progress=status.measure_total?`${status.measure_completed||0}/${status.measure_total} proxies measured · ${status.download_mb||1} MB each`:''}else{pct=status.percent||0;progress=status.total?`${status.completed||0}/${status.total} checks · ${pct}%`:''}$('#progressBar').style.width=pct+'%';$('#scanProgress').textContent=progress;$('#scanStatus').textContent=label;$('#scanStatus').className=cls;$('#stopBtn').disabled=!scanning;$('#measureBtn').disabled=scanning||measuring||!alive;$('#downloadMB').disabled=measuring}
async function refresh(){try{const [st,rs,status,h]=await Promise.all([jget('/api/stats'),jget('/api/proxies'),jget('/api/status'),jget('/healthz')]);all=(rs||[]).filter(x=>x.alive).sort((a,b)=>{const al=a.latency_ms>0?a.latency_ms:Number.MAX_SAFE_INTEGER;const bl=b.latency_ms>0?b.latency_ms:Number.MAX_SAFE_INTEGER;if(al!==bl)return al-bl;return (b.down_mbps||0)-(a.down_mbps||0)});$('#alive').textContent=st.alive||0;$('#navAlive').textContent=st.alive||0;$('#lowest').textContent=`Lowest latency: ${st.lowest_latency_ms||0} ms`;$('#version').textContent='v'+h.version;updateStatus(status,st.alive||0);render();if(status.scanning||status.measuring){clearTimeout(timer);timer=setTimeout(refresh,1200)}}catch(e){$('#scanStatus').textContent='refresh error';$('#scanStatus').className='status err'}}
async function stopScan(){if(!currentStatus.scanning)return;$('#scanStatus').textContent='stopping proxy check…';try{const r=await fetch('/api/scan/stop',{method:'POST',headers:authHeaders()});if(!r.ok)throw new Error((await r.text()).trim());setTimeout(refresh,250)}catch(e){$('#scanStatus').textContent=e.message;$('#scanStatus').className='status err'}}
async function startMeasure(){let mb=parseInt($('#downloadMB').value,10);if(!Number.isFinite(mb)||mb<1||mb>100){$('#scanStatus').textContent='Download MB must be 1-100';$('#scanStatus').className='status err';return}sessionStorage.setItem('psoc-download-mb',String(mb));$('#measureBtn').disabled=true;try{const r=await fetch('/api/measure',{method:'POST',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({download_mb:mb})});if(!r.ok)throw new Error((await r.text()).trim());$('#scanStatus').textContent='downspeed measurement started';$('#scanStatus').className='status running';setTimeout(refresh,250)}catch(e){$('#scanStatus').textContent=e.message;$('#scanStatus').className='status err';$('#measureBtn').disabled=false}}
$('#filter').addEventListener('input',render);$('#refreshBtn').addEventListener('click',refresh);$('#stopBtn').addEventListener('click',stopScan);$('#measureBtn').addEventListener('click',startMeasure);$('#downloadMB').value=sessionStorage.getItem('psoc-download-mb')||'1';refresh();
</script>
</body>
</html>
