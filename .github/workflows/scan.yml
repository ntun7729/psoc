name: Manual proxy check

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Explicit host:port or protocol://host:port targets (whitespace/newline separated)"
        required: true
        type: string
      protocols:
        description: "Protocols for bare host:port targets"
        required: true
        default: "http,socks5,socks4"
        type: choice
        options:
          - "http,socks5,socks4"
          - "http"
          - "socks5"
          - "socks4"
          - "http,socks5"
      verify_url:
        description: "HTTP(S) URL fetched through each proxy"
        required: true
        default: "https://example.com/"
        type: string

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Write explicit targets
        env:
          TARGETS: ${{ inputs.targets }}
        run: printf '%s\n' "$TARGETS" > targets.txt
      - name: Check proxies
        run: >-
          go run . scan
          --input targets.txt
          --output results.json
          --format json
          --protocols '${{ inputs.protocols }}'
          --verify-url '${{ inputs.verify_url }}'
          --concurrency 32
          --timeout 8s
          --max-targets 500
      - uses: actions/upload-artifact@v4
        with:
          name: psoc-results
          path: results.json
          if-no-files-found: error
          retention-days: 7
