name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          source_version="$(sed -n 's/^const version = "\([^"]*\)"/\1/p' main.go)"
          test -n "$version"
          if [[ "$version" != "$source_version" ]]; then
            echo "VERSION ($version) does not match main.go ($source_version)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags='-s -w' -o "dist/psoc-linux-$arch" .
          done
          ./dist/psoc-linux-amd64 version
          (cd dist && sha256sum psoc-linux-amd64 psoc-linux-arm64 > SHA256SUMS)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists" >&2
            exit 1
          fi
          gh release create "$TAG" \
            dist/psoc-linux-amd64 \
            dist/psoc-linux-arm64 \
            dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "psoc $TAG" \
            --generate-notes \
            --latest
